name: piawka-paper
channels:
  - conda-forge
  - bioconda
dependencies:
  # piawka is NOT installed from conda for the benchmarks: the paper uses upstream commit 27e6ae3 (0.9.1 + 2 commits),
  # which is not on bioconda (latest there: 0.9.0). The scripts take it from tools/piawka-27e6ae3 (see README, "Setup").
  - htslib=1.24
  - bcftools=1.24
  - tabix
  - gawk
  - parallel
  - python=3.10
  - pip
  - numpy
  - pandas
  - scipy
  - r-base=4.5
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-readr
  - r-patchwork
  - r-ggforce
  - r-ggtext
  - r-stringr
  - r-scales
  - r-rcolorbrewer
  - pip:
      # pixy 2.2.3 is an untagged master build; this is the exact commit that was benchmarked.
      - git+https://github.com/ksamuk/pixy.git@21c7c33dea315a035d6aff86caba018ab668864a
      - openpyxl
# NOTE: the R package `cvequality` (used by scripts/analyze_real_pi_stats_tests.R)
# is not packaged for conda. Install it from CRAN after creating the env:
#   conda run -n piawka-paper Rscript -e 'install.packages("cvequality", repos="https://cloud.r-project.org")'
